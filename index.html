<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dev Thonangi — software engineer working across AI, computer vision, backend systems, and cloud infrastructure.">
  <meta name="theme-color" content="#0c0d11">
  <title>Dev Thonangi</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0c0d11;
      --window: #12141a;
      --chrome: #1b1d24;
      --text: #e9e7e1;
      --muted: #8e9098;
      --line: #30323a;
      --accent: #8c72ff;
      --accent-soft: rgba(140, 114, 255, .13);
      --shadow: rgba(0, 0, 0, .42);
    }

    :root.light {
      color-scheme: light;
      --page: #f7f7f5;
      --window: #fff;
      --chrome: #efeeeb;
      --text: #2b2a28;
      --muted: #74716d;
      --line: #d7d5cf;
      --accent: #7548ff;
      --accent-soft: rgba(117, 72, 255, .08);
      --shadow: rgba(45, 42, 35, .12);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      color: var(--text);
      background: var(--page);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      transition: color .3s ease, background .3s ease;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea { font: inherit; }
    a { color: inherit; }

    .window {
      width: min(100%, 760px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--window);
      box-shadow: 0 28px 80px var(--shadow);
      animation: window-in .75s cubic-bezier(.22, 1, .36, 1) both;
      transition: background .3s ease, border-color .3s ease;
    }

    .titlebar {
      min-height: 58px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      background: var(--chrome);
      transition: background .3s ease, border-color .3s ease;
    }
    .traffic { display: flex; gap: 9px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f57; }
    .dot.yellow { background: #febc2e; }
    .dot.green { background: #28c840; }
    .domain { color: var(--muted); font-size: 14px; letter-spacing: .03em; }
    .theme-toggle {
      justify-self: end;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      color: var(--text);
      background: transparent;
      cursor: pointer;
      font-size: 18px;
    }
    .theme-toggle:hover { background: var(--accent-soft); }

    .content { padding: clamp(32px, 7vw, 56px); }

    .identity { display: flex; align-items: center; gap: 24px; }
    .monogram {
      width: 88px;
      height: 88px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 28px;
      font-weight: 800;
      animation: float 5s ease-in-out infinite;
    }
    h1 { margin: 0; color: var(--accent); font-size: clamp(24px, 5vw, 30px); letter-spacing: -.04em; }
    .rule { width: 180px; height: 1px; margin: 15px 0; background: var(--muted); transform-origin: left; animation: draw-line .85s .3s both; }
    .handle { margin: 0; color: var(--muted); }

    .summary {
      margin: 58px 0 48px;
      font-size: clamp(20px, 4vw, 27px);
      line-height: 1.7;
      letter-spacing: -.035em;
    }
    .cursor { display: inline-block; width: .55em; height: 1em; margin-left: 4px; vertical-align: -.12em; background: var(--accent); animation: blink 1s steps(1) infinite; }

    .menu { display: grid; gap: 8px; }
    .menu-link {
      display: grid;
      grid-template-columns: 48px 28px 1fr;
      align-items: center;
      min-height: 45px;
      margin: 0 -12px;
      padding: 0 12px;
      border-radius: 8px;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 21px;
      transition: color .16s, background .16s, transform .16s;
    }
    .menu-link:hover, .menu-link:focus-visible { color: var(--accent); background: var(--accent-soft); outline: none; transform: translateX(5px); }
    .key, .path { color: var(--muted); font-family: "SFMono-Regular", Consolas, monospace; font-size: 14px; }
    .menu-link:hover .path { color: var(--accent); }

    .socials { display: flex; flex-wrap: wrap; gap: 26px; margin-top: 50px; }
    .socials a { color: var(--muted); font-size: 14px; text-decoration: none; }
    .socials a:hover { color: var(--accent); }

    .statusbar {
      min-height: 51px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: var(--chrome);
      font-size: 12px;
      transition: background .3s ease, border-color .3s ease;
    }
    .status-right { display: flex; gap: 16px; }
    .statusbar button { padding: 0; border: 0; color: inherit; background: none; cursor: pointer; }
    .statusbar button:hover { color: var(--accent); }

    .contact-panel {
      display: none;
      padding: 0 clamp(32px, 7vw, 56px) clamp(34px, 7vw, 54px);
      animation: panel-in .3s ease both;
    }
    .contact-panel.open { display: block; }
    .contact-panel h2 { margin: 0 0 22px; color: var(--accent); font-size: 19px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { margin-bottom: 12px; }
    .field.full { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
    input, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      outline: none;
      color: var(--text);
      background: var(--chrome);
    }
    textarea { min-height: 86px; resize: vertical; }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .send { width: 100%; min-height: 43px; border: 0; border-radius: 7px; color: white; background: var(--accent); font-weight: 800; cursor: pointer; }
    .send:hover { filter: brightness(1.1); }

    @keyframes window-in { from { opacity: 0; transform: translateY(24px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes panel-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    @keyframes float { 50% { transform: translateY(-6px); } }
    @keyframes draw-line { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 50% { opacity: 0; } }

    @media (max-width: 580px) {
      body { padding: 16px 12px; }
      .window { border-radius: 13px; }
      .titlebar { min-height: 50px; padding: 0 14px; }
      .dot { width: 10px; height: 10px; }
      .domain { font-size: 11px; }
      .content { padding: 30px 24px 36px; }
      .identity { gap: 16px; }
      .monogram { width: 66px; height: 66px; font-size: 22px; }
      .rule { width: 130px; }
      .summary { margin: 42px 0 34px; }
      .menu-link { grid-template-columns: 42px 24px 1fr; font-size: 19px; }
      .socials { margin-top: 38px; gap: 20px; }
      .statusbar { padding: 0 14px; }
      .status-right { display: none; }
      .contact-panel { padding: 0 24px 34px; }
      .form-grid { grid-template-columns: 1fr; gap: 0; }
      .field.full { grid-column: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="window">
    <div class="titlebar">
      <div class="traffic" aria-hidden="true">
        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      </div>
      <span class="domain">devthonangi.dev</span>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme">☀</button>
    </div>

    <div class="content">
      <div class="identity">
        <div class="monogram" aria-hidden="true">DT</div>
        <div>
          <h1>Dev Thonangi</h1>
          <div class="rule"></div>
          <p class="handle">dev@systems#</p>
        </div>
      </div>

      <p class="summary">Software Engineer.<br>AI Builder. Systems Thinker.<span class="cursor" aria-hidden="true"></span></p>

      <nav class="menu" aria-label="Portfolio navigation">
        <a class="menu-link" href="https://github.com/devthonangi" target="_blank" rel="noopener noreferrer" data-key="g">
          <span class="key">[g]</span><span class="path">~/</span><span>github</span>
        </a>
        <a class="menu-link" href="https://www.linkedin.com/in/thonangidev/" target="_blank" rel="noopener noreferrer" data-key="l">
          <span class="key">[l]</span><span class="path">~/</span><span>linkedin</span>
        </a>
        <a class="menu-link" href="#contact" id="contact-link" data-key="c">
          <span class="key">[c]</span><span class="path">~/</span><span>contact</span>
        </a>
      </nav>

      <div class="socials">
        <a href="https://github.com/devthonangi" target="_blank" rel="noopener noreferrer">github</a>
        <a href="https://www.linkedin.com/in/thonangidev/" target="_blank" rel="noopener noreferrer">linkedin</a>
        <a href="#contact" id="email-link">message</a>
      </div>
    </div>

    <section class="contact-panel" id="contact" aria-labelledby="contact-heading">
      <h2 id="contact-heading">~/contact</h2>
      <form name="contact" method="POST" data-netlify="true" action="/thank-you.html">
        <input type="hidden" name="form-name" value="contact">
        <div class="form-grid">
          <div class="field"><label for="name">name</label><input id="name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="email">email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="field full"><label for="message">message</label><textarea id="message" name="message" required></textarea></div>
        </div>
        <button class="send" type="submit">send →</button>
      </form>
    </section>

    <div class="statusbar">
      <span>● Boca Raton, FL</span>
      <div class="status-right"><button type="button" id="close-contact">[x] close</button><span>[c] contact</span><span>[t] theme</span></div>
    </div>
  </main>

  <script>
    const root = document.documentElement;
    const toggle = document.querySelector('#theme-toggle');
    const panel = document.querySelector('#contact');
    const contactLink = document.querySelector('#contact-link');
    const emailLink = document.querySelector('#email-link');
    const closeContact = document.querySelector('#close-contact');

    function setTheme(light) {
      root.classList.toggle('light', light);
      toggle.textContent = light ? '☾' : '☀';
      toggle.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
    }

    function toggleContact(force) {
      const open = typeof force === 'boolean' ? force : !panel.classList.contains('open');
      panel.classList.toggle('open', open);
      if (open) {
        history.replaceState(null, '', '#contact');
        requestAnimationFrame(() => document.querySelector('#name').focus());
      } else {
        history.replaceState(null, '', location.pathname);
      }
    }

    toggle.addEventListener('click', () => setTheme(!root.classList.contains('light')));
    contactLink.addEventListener('click', (event) => { event.preventDefault(); toggleContact(); });
    emailLink.addEventListener('click', (event) => { event.preventDefault(); toggleContact(true); });
    closeContact.addEventListener('click', () => toggleContact(false));

    document.addEventListener('keydown', (event) => {
      if (/input|textarea/i.test(document.activeElement.tagName)) return;
      const key = event.key.toLowerCase();
      if (key === 'c') toggleContact();
      if (key === 't') setTheme(!root.classList.contains('light'));
      if (key === 'g') window.open('https://github.com/devthonangi', '_blank', 'noopener');
      if (key === 'l') window.open('https://www.linkedin.com/in/thonangidev/', '_blank', 'noopener');
      if (key === 'escape' || key === 'x') toggleContact(false);
    });

    if (location.hash === '#contact') toggleContact(true);
  </script>
</body>
</html>
