<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Dev Thonangi, a software engineer working across AI, computer vision, backend systems, and cloud infrastructure.">
  <meta name="theme-color" content="#08090d">
  <title>Dev Thonangi — Contact</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #08090d;
      --surface: rgba(18, 20, 28, .78);
      --text: #f5f6fa;
      --muted: #9a9eab;
      --line: rgba(255, 255, 255, .12);
      --accent: #8b7cff;
      --accent-two: #4fd1c5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      background: var(--background);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before, body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 36rem;
      height: 36rem;
      border-radius: 50%;
      filter: blur(110px);
      opacity: .18;
      pointer-events: none;
      animation: drift 13s ease-in-out infinite alternate;
    }
    body::before { top: -16rem; left: -12rem; background: var(--accent); }
    body::after { right: -14rem; bottom: -18rem; background: var(--accent-two); animation-delay: -6s; }

    a { color: inherit; }
    button, input, textarea { font: inherit; }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(calc(100% - 40px), 1080px);
      margin: 0 auto;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      color: var(--muted);
      font-size: 13px;
    }
    .brand { color: var(--text); font-weight: 750; letter-spacing: .08em; text-decoration: none; }
    .availability { display: flex; align-items: center; gap: 8px; }
    .availability::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #68e09b;
      box-shadow: 0 0 0 5px rgba(104, 224, 155, .09);
      animation: pulse 2.4s ease-in-out infinite;
    }

    main { display: grid; place-items: center; padding: 58px 0 78px; }

    .contact-card {
      position: relative;
      width: min(100%, 620px);
      overflow: hidden;
      padding: clamp(26px, 6vw, 48px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 28px 90px rgba(0, 0, 0, .38);
      backdrop-filter: blur(18px);
      animation: card-in .8s cubic-bezier(.22, 1, .36, 1) both;
    }
    .contact-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -65%;
      width: 45%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: scan 4.5s ease-in-out infinite;
    }

    .intro { margin-bottom: 34px; }
    .label { margin: 0 0 15px; color: var(--accent-two); font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(35px, 7vw, 58px); letter-spacing: -.055em; line-height: 1.02; }
    .intro p:last-child { max-width: 500px; margin: 16px 0 0; color: var(--muted); line-height: 1.65; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { margin-bottom: 15px; }
    .field.full { grid-column: 1 / -1; }
    label { display: block; margin: 0 0 7px; color: #c5c8d1; font-size: 12px; font-weight: 650; }
    input, textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      color: var(--text);
      background: rgba(7, 8, 12, .6);
      transition: border-color .18s, box-shadow .18s;
    }
    textarea { min-height: 104px; resize: vertical; }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 124, 255, .12); }

    .submit {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 11px;
      color: #0b0c10;
      background: linear-gradient(120deg, var(--accent-two), #b6aaff, var(--accent-two));
      background-size: 220% 100%;
      font-weight: 800;
      cursor: pointer;
      animation: button-flow 5s linear infinite;
      transition: transform .18s, box-shadow .18s;
    }
    .submit:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(114, 217, 207, .2); }
    .submit:active { transform: translateY(0); }

    .socials { display: flex; justify-content: center; gap: 22px; margin-top: 24px; font-size: 13px; }
    .socials a { color: var(--muted); text-decoration: none; }
    .socials a:hover { color: var(--text); }

    footer { border-top: 1px solid var(--line); }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }

    @keyframes card-in { from { opacity: 0; transform: translateY(24px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes drift { to { transform: translate(70px, 55px) scale(1.1); } }
    @keyframes pulse { 50% { opacity: .45; transform: scale(.8); } }
    @keyframes scan { 0%, 12% { left: -65%; } 55%, 100% { left: 120%; } }
    @keyframes button-flow { to { background-position: 220% 0; } }

    @media (max-width: 580px) {
      .page { width: min(calc(100% - 24px), 1080px); }
      header { min-height: 66px; }
      .availability span { display: none; }
      main { align-items: start; padding: 28px 0 50px; }
      .contact-card { border-radius: 18px; }
      .form-grid { grid-template-columns: 1fr; gap: 0; }
      .field.full { grid-column: auto; }
      footer { min-height: 66px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="/">DEV</a>
      <div class="availability"><span>Open to conversations</span></div>
    </header>

    <main>
      <section class="contact-card" aria-labelledby="contact-title">
        <div class="intro">
          <p class="label">Software engineer · AI systems</p>
          <h1 id="contact-title">Let’s build something useful.</h1>
          <p>I work across AI, computer vision, backend systems, and cloud infrastructure. Send a short note and I’ll get back to you.</p>
        </div>

        <form name="contact" method="POST" data-netlify="true" action="/thank-you.html">
          <input type="hidden" name="form-name" value="contact">
          <div class="form-grid">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field full">
              <label for="message">Message</label>
              <textarea id="message" name="message" required></textarea>
            </div>
          </div>
          <button class="submit" type="submit">Send message →</button>
        </form>

        <div class="socials" aria-label="Social links">
          <a href="https://github.com/devthonangi" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
          <a href="https://www.linkedin.com/in/thonangidev/" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
        </div>
      </section>
    </main>

    <footer>
      <span>© <span id="year"></span> Dev Thonangi</span>
      <a href="https://github.com/devthonangi" target="_blank" rel="noopener noreferrer">Software & systems</a>
    </footer>
  </div>

  <script>document.querySelector('#year').textContent = new Date().getFullYear();</script>
</body>
</html>
