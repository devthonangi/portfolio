<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Message sent — Dev Thonangi</title>
  <style>
    :root { color-scheme: dark; --bg:#080b12; --surface:#101622; --text:#f5f7fb; --muted:#a4adbc; --lime:#c8ff45; --cyan:#45d9ff; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:var(--text); background:linear-gradient(rgba(69,217,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(69,217,255,.035) 1px,transparent 1px),var(--bg); background-size:42px 42px; font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
    main { width:min(100%,680px); padding:clamp(30px,7vw,64px); border:3px solid var(--text); background:var(--surface); box-shadow:12px 12px 0 var(--cyan); }
    .label { margin:0 0 18px; color:var(--lime); font-family:monospace; font-size:11px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:0 0 18px; font-size:clamp(48px,10vw,84px); letter-spacing:-.07em; line-height:.9; text-transform:uppercase; }
    p { max-width:520px; margin:0 0 32px; color:var(--muted); font-size:17px; line-height:1.6; }
    a { display:inline-flex; min-height:46px; align-items:center; padding:0 17px; border:2px solid var(--text); color:var(--bg); background:var(--lime); box-shadow:5px 5px 0 var(--text); font-size:12px; font-weight:900; text-decoration:none; text-transform:uppercase; }
    a:hover { transform:translate(3px,3px); box-shadow:2px 2px 0 var(--text); }
  </style>
</head>
<body><main><p class="label">Transmission complete</p><h1>Message sent.</h1><p>Thanks for reaching out. I’ll review your note and respond as soon as I can.</p><a href="/">Return to portfolio</a></main></body>
</html>
