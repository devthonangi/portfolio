<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <title>Message sent — Dev Thonangi</title>
  <style>
    :root { color-scheme: dark; --text: #f5f6fa; --muted: #9a9eab; --accent: #8b7cff; --accent-two: #4fd1c5; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--text);
      background: #08090d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      width: 34rem;
      height: 34rem;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-two));
      filter: blur(130px);
      opacity: .18;
      animation: breathe 7s ease-in-out infinite alternate;
    }
    main { position: relative; max-width: 620px; text-align: center; animation: enter .7s cubic-bezier(.22, 1, .36, 1) both; }
    h1 { margin: 0 0 14px; font-size: clamp(42px, 9vw, 72px); letter-spacing: -.055em; }
    p { margin: 0 0 32px; color: var(--muted); font-size: 17px; line-height: 1.6; }
    a { display: inline-block; padding: 12px 18px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; color: var(--text); text-decoration: none; transition: border-color .2s, transform .2s; }
    a:hover { border-color: var(--accent); transform: translateY(-2px); }
    @keyframes enter { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    @keyframes breathe { to { transform: scale(1.18) rotate(18deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <h1>Message sent.</h1>
    <p>Thanks for reaching out. I’ll read your note and get back to you soon.</p>
    <a href="/">Back to contact</a>
  </main>
</body>
</html>
