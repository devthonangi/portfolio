<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Thank you for contacting Dev Thonangi.">
  <title>Message sent — Dev Thonangi</title>
  <style>
    :root { --paper: #f4f1e9; --ink: #181816; --muted: #65635d; --accent: #305cff; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--ink);
      background: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
    }
    main { width: min(100%, 720px); }
    .label { margin: 0 0 24px; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0 0 24px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(48px, 10vw, 88px); font-weight: 400; letter-spacing: -.05em; line-height: 1; }
    p { max-width: 520px; margin: 0 0 38px; color: var(--muted); font-size: 18px; line-height: 1.6; }
    a { color: var(--ink); text-underline-offset: 5px; }
    a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="label">Message sent</p>
    <h1>Thank you.</h1>
    <p>Your message is on its way. I’ll get back to you as soon as I can.</p>
    <a href="/">Return to the portfolio →</a>
  </main>
</body>
</html>
